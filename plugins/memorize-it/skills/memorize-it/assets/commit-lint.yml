name: memorize-it commit lint

# Template workflow for consuming projects.
#
# Generated by the memorize-it skill Setup. To regenerate or customise,
# run "set up memorize-it" in Claude Code or Claude.ai Cowork.
#
# Deterministic check — no secrets or Claude token required.
#
# Guards what merges into the trunk: with branch protection making this a
# REQUIRED status check, a non-compliant PR cannot merge. Setup picks CHECK_MODE
# from your squash-message source:
#   - "commits" — validate every commit the PR adds (use when the host squashes
#     by concatenating commit messages, e.g. GitHub "commit details").
#   - "pr"      — validate the PR title + description (use when the host squashes
#     from the PR title + description, which then becomes the trunk commit body).
#     REQUIRES memorize-it's PR/MR mirroring: in this mode the description is the
#     trunk message, so it must carry the labeled key: value block itself, with
#     the labels at column 0 (not indented under a heading, not inside a fenced
#     block). Markdown headings alone will not satisfy this check, and would not
#     be parseable off the trunk either.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: memorize-it-commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check messages against the memorize-it standard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu

          # --- CONFIG (memorize-it setup fills these from your confirmed choices) ---
          # Subject pattern. Default = bracket issue key, e.g. "[WEB-123] Summary".
          #   Conventional-commits alternative:
          #   SUBJECT_REGEX='^(feat|fix|chore|docs|refactor|test|build|ci|perf|style)(\(.+\))?!?: .+'
          SUBJECT_REGEX='^\[[A-Za-z]*-?[0-9]+\] .+'
          # Required body field labels (space-separated), matched as "^label:".
          REQUIRED_FIELDS='why what'
          # Assistant-attribution footers the standard forbids. Set to '' to disable.
          ATTRIBUTION_REGEX='Co-Authored-By:.*(Claude|Copilot|Cursor|Codex)|Generated with .*(Claude|Copilot|Cursor|Codex)'
          # The three content patterns below are duplicated in assets/commit-msg,
          # assets/commit-lint.yml and references/git-recipes.md — change all three, or
          # the documented sweep will disagree with what actually rejects a commit.
          # Secret-shaped values that must never enter permanent history. Set to '' to disable.
          SECRET_REGEX='(AKIA|ASIA)[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{16,}|xox[baprs]-[0-9A-Za-z-]{10,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|BEGIN [A-Z ]*PRIVATE KEY|(pass(word|wd)?|secret|token|api[_-]?key|access[_-]?key)[[:space:]]*[:=][[:space:]]*.?[A-Za-z0-9+/=_-]{12,}'
          # One developer's local setup, which is never project context. Set to '' to disable.
          LOCAL_REGEX='/(Users|home)/[A-Za-z0-9._-]+/|\.git/info/exclude|(^|[^A-Za-z])\.env($|[^A-Za-z])'
          # "commits" or "pr" — see the header comment.
          CHECK_MODE='commits'
          # --------------------------------------------------------------------------

          status=0
          say() { echo "::error::memorize-it: $1"; status=1; }

          check_subject() {
            printf '%s\n' "$1" | grep -Eq "$SUBJECT_REGEX" \
              || say "subject must match the convention ($SUBJECT_REGEX): $1"
          }
          check_fields() {
            for field in $REQUIRED_FIELDS; do
              # Labels must sit at column 0 — indented under a heading or inside
              # a fenced block they will not match, and they would not be
              # parseable off the trunk either.
              printf '%s\n' "$1" | grep -iq "^$field:" \
                || say "$2 is missing a '$field:' line at the start of a line$3"
            done
          }
          check_pattern() {
            # $1 body, $2 label, $3 regex, $4 message
            [ -n "$3" ] || return 0
            printf '%s\n' "$1" | grep -Eiq -- "$3" && say "$2 $4" || true
          }
          check_content() {
            check_pattern "$1" "$2" "$ATTRIBUTION_REGEX" \
              "carries an assistant-attribution footer — commits stay authored by the developer"
            check_pattern "$1" "$2" "$SECRET_REGEX" \
              "looks like it contains a credential — remove it, and rotate it if it is real"
            check_pattern "$1" "$2" "$LOCAL_REGEX" \
              "references a local path or local-only setup — describe the project, not one machine"
          }

          case "$CHECK_MODE" in
            pr)
              check_subject "$PR_TITLE"
              # In pr mode the description becomes the trunk commit message, so
              # it must carry the labeled block itself — that is what memorize-it
              # calls PR/MR mirroring, and it is a prerequisite for this mode.
              check_fields "$PR_BODY" "PR description" \
                " — enable PR/MR mirroring so the labeled block is kept in the description"
              check_content "$PR_BODY" "PR description"
              ;;
            *)
              # Assign first: `set -e` does not fire on a failing command
              # substitution inside a `for` word list, so an unreachable
              # BASE_SHA (base branch force-pushed after this event was
              # composed) would silently produce an empty list and pass.
              if ! shas=$(git rev-list "$BASE_SHA".."$HEAD_SHA" 2>&1); then
                say "could not list the PR's commits — is $BASE_SHA reachable? (${shas})"
                shas=''
              elif [ -z "$shas" ]; then
                say "the range $BASE_SHA..$HEAD_SHA contains no commits to check"
              fi
              for sha in $shas; do
                subject=$(git log -1 --format=%s "$sha")
                body=$(git log -1 --format=%B "$sha")
                case "$subject" in
                  Merge\ *|Revert\ *|Reapply\ *|fixup!\ *|squash!\ *|amend!\ *) continue ;;
                esac
                check_subject "$subject"
                check_fields "$body" "commit ${sha} body"
                check_content "$body" "commit ${sha} body"
              done
              ;;
          esac

          if [ "$status" -ne 0 ]; then
            echo "memorize-it: see .claude/rules/memorize-it.md for the commit standard."
            exit 1
          fi
          echo "memorize-it: commit message check passed."
