name: memorize-it commit lint

# Template workflow for consuming projects.
#
# Generated by the memorize-it skill Setup. To regenerate or customise,
# run "set up memorize-it" in Claude Code or Claude.ai Cowork.
#
# Deterministic check — no secrets or Claude token required.
#
# Guards what merges into the trunk: with branch protection making this a
# REQUIRED status check, a non-compliant PR cannot merge. Setup picks CHECK_MODE
# from your squash-message source:
#   - "commits" — validate every commit the PR adds (use when the host squashes
#     by concatenating commit messages, e.g. GitHub "commit details").
#   - "pr"      — validate the PR title + description (use when the host squashes
#     from the PR title + description, which then becomes the trunk commit body).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: memorize-it-commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check messages against the memorize-it standard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu

          # --- CONFIG (memorize-it setup fills these from your confirmed choices) ---
          # Subject pattern. Default = bracket issue key, e.g. "[WEB-123] Summary".
          #   Conventional-commits alternative:
          #   SUBJECT_REGEX='^(feat|fix|chore|docs|refactor|test|build|ci|perf|style)(\(.+\))?!?: .+'
          SUBJECT_REGEX='^\[[A-Za-z]*-?[0-9]+\] .+'
          # Required body field labels (space-separated), matched as "^label:".
          REQUIRED_FIELDS='why what'
          # "commits" or "pr" — see the header comment.
          CHECK_MODE='commits'
          # --------------------------------------------------------------------------

          status=0
          say() { echo "::error::memorize-it: $1"; status=1; }

          check_subject() {
            printf '%s\n' "$1" | grep -Eq "$SUBJECT_REGEX" \
              || say "subject must match the convention ($SUBJECT_REGEX): $1"
          }
          check_fields() {
            for field in $REQUIRED_FIELDS; do
              printf '%s\n' "$1" | grep -iq "^$field:" \
                || say "$2 is missing a '$field:' line"
            done
          }

          case "$CHECK_MODE" in
            pr)
              check_subject "$PR_TITLE"
              check_fields "$PR_BODY" "PR description"
              ;;
            *)
              for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
                subject=$(git log -1 --format=%s "$sha")
                body=$(git log -1 --format=%B "$sha")
                case "$subject" in
                  Merge\ *|Revert\ *|Reapply\ *|fixup!\ *|squash!\ *|amend!\ *) continue ;;
                esac
                check_subject "$subject"
                check_fields "$body" "commit ${sha} body"
              done
              ;;
          esac

          if [ "$status" -ne 0 ]; then
            echo "memorize-it: see .claude/rules/memorize-it.md for the commit standard."
            exit 1
          fi
          echo "memorize-it: commit message check passed."
